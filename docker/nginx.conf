# Veles-MOEX frontend server (MVP-8.0 G2).
# The SPA is a local tool served on 127.0.0.1; headers and compression are
# hygiene, not a hard security boundary (API auth is a separate decision).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers on every response. `add_header` inside a `location`
    # replaces the inherited list, so locations that set Cache-Control repeat
    # these headers explicitly.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; connect-src 'self'" always;

    # Compression for text-like assets (Vite emits no pre-compressed files).
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Proxy API calls to the backend service.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets: content-addressed files, cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; connect-src 'self'" always;
        try_files $uri =404;
    }

    # SPA fallback: HTML is never cached so a new deploy is picked up at once.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; connect-src 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
