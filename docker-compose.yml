services:
  postgres:
    image: postgres:16-alpine
    container_name: veles_moex_postgres
    environment:
      POSTGRES_USER: veles
      POSTGRES_PASSWORD: veles
      POSTGRES_DB: veles_moex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veles -d veles_moex"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: veles_moex_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: veles_moex_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://veles:veles@postgres:5432/veles_moex
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: docker
      APP_NAME: Veles-MOEX
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: veles_moex_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
